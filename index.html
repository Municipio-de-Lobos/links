<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Municipio de Lobos · Links</title>
  <meta name="description" content="Sitio oficial, redes sociales y accesos del Municipio de Lobos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* ►► TAMAÑO DEL LOGO: cambiá solo este número ◄◄ */
      --logo-width:  150px;

      --bg:          #FFFFFF;
      --bg-2:        #FFFFFF;
      --ink:         #161616;
      --ink-2:       #3A3A3A;
      --muted:       #7A7A7A;
      --line:        #EBEBEB;
      --line-2:      #E0E0E0;
      --red:         #E13A2E;
      --red-dark:    #C22E23;
      --red-soft:    #FDECEA;
      --red-soft-2:  #FBD9D5;
      --radius:      16px;
      --shadow-1:    0 1px 2px rgba(0,0,0,.04), 0 1px 0 rgba(0,0,0,.02);
      --shadow-2:    0 10px 30px -12px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 20px;
    }

    /* ── header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0 20px;
    }
    header .logo {
      width: var(--logo-width);
      max-width: 90%;
      height: auto;
      display: block;
    }
    /* ── featured links ── */
    section.featured {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flink {
      display: grid;
      grid-template-columns: 44px 1fr 24px;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      background: linear-gradient(135deg, #FFF6F5 0%, #FFFFFF 65%);
      border: 1px solid var(--red-soft-2);
      border-radius: var(--radius);
      color: var(--ink);
      text-decoration: none;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 0 0 1px rgba(225,58,46,.05),
                  var(--shadow-2),
                  0 0 26px -10px rgba(225,58,46,.45);
      transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .flink:hover { transform: translateY(-1px); }
    .flink:active { transform: translateY(0); }

    /* animated shine sweep to draw the eye */
    .flink::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.75) 50%, transparent 80%);
      transform: translateX(-120%);
      animation: shine 3.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes shine {
      0%, 35%   { transform: translateX(-120%); }
      65%, 100% { transform: translateX(120%); }
    }
    @keyframes pulse-white {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    .flink .icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--red-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red-dark);
      flex-shrink: 0;
      z-index: 2;
      position: relative;
    }
    .flink .icon svg { width: 19px; height: 19px; display: block; }

    .flink .body { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; z-index: 2; position: relative; }
    .flink .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #fff;
      background: var(--red);
      padding: 2px 8px;
      border-radius: 999px;
      line-height: 1.5;
    }
    .flink .tag .bd {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      animation: pulse-white 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    .flink .label { font-size: 15.5px; font-weight: 700; letter-spacing: -.005em; color: var(--ink); }
    .flink .sub   { font-size: 12.5px; color: var(--ink-2); font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .flink .chev { color: var(--red); z-index: 2; position: relative; }
    .flink .chev svg { width: 18px; height: 18px; display: block; }

    /* ── links ── */
    nav.links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link {
      display: grid;
      grid-template-columns: 44px 1fr 24px;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-1);
      transition: transform .25s cubic-bezier(.2,.7,.2,1),
                  box-shadow .25s ease,
                  border-color .25s ease;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .link::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(225,58,46,.04), transparent);
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }
    .link:hover { transform: translateY(-1px); border-color: var(--line-2); box-shadow: var(--shadow-2); }
    .link:hover::after { opacity: 1; }
    .link:hover .chev { color: var(--red); transform: translateX(3px); }
    .link:active { transform: translateY(0); }

    .link .icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background .25s ease, color .25s ease;
      flex-shrink: 0;
    }
    .link:hover .icon { background: var(--red-soft); color: var(--red-dark); }
    .link .icon svg { width: 19px; height: 19px; display: block; }

    .link .body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .link .label {
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -.005em;
      color: var(--ink);
    }
    .link .sub {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link .chev {
      color: #C4C4C4;
      transition: color .25s ease, transform .25s ease;
    }
    .link .chev svg { width: 18px; height: 18px; display: block; }

    /* ── footer ── */
    footer {
      margin-top: 8px;
      padding-top: 22px;
      border-top: 1px dashed var(--line-2);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      text-align: center;
      letter-spacing: .02em;
    }

    /* ── entry animation ── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    header, .flink, .link, footer { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
    header                 { animation-delay: .02s; }
    .flink                 { animation-delay: .10s; }
    .link:nth-child(1)     { animation-delay: .16s; }
    .link:nth-child(2)     { animation-delay: .22s; }
    .link:nth-child(3)     { animation-delay: .28s; }
    .link:nth-child(4)     { animation-delay: .34s; }
    .link:nth-child(5)     { animation-delay: .40s; }
    .link:nth-child(6)     { animation-delay: .46s; }
    footer                 { animation-delay: .52s; }

    @media (max-width: 420px) {
      body { padding: 28px 16px 32px; }
      .stage { gap: 18px; }
      .link, .flink { padding: 13px 14px; grid-template-columns: 40px 1fr 22px; gap: 12px; }
      .link .icon, .flink .icon { width: 38px; height: 38px; border-radius: 10px; }
      .link .label, .flink .label { font-size: 15px; }
    }
  </style>
</head>

<script>
  // Oculta los destacados con data-hasta vencido (hora de Argentina, -03:00).
  // No hace falta tocar nada acá: la fecha se edita arriba, en el atributo data-hasta.
  (function () {
    var ahora = new Date();
    document.querySelectorAll('[data-hasta]').forEach(function (el) {
      var hasta = new Date(el.getAttribute('data-hasta'));
      if (!isNaN(hasta) && ahora > hasta) el.style.display = 'none';
    });
    // Si la sección de destacados quedó sin ningún link visible, la ocultamos entera.
    document.querySelectorAll('section.featured').forEach(function (sec) {
      var visibles = Array.prototype.filter.call(
        sec.querySelectorAll('.flink'),
        function (f) { return f.style.display !== 'none'; }
      );
      if (visibles.length === 0) sec.style.display = 'none';
    });
  })();
</script>
